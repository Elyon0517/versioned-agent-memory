[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-memory-kit"
version = "0.1.0"
description = "Versioned long-term and session memory for stateful applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Elyon Li"}]
keywords = ["memory", "context", "state", "provenance", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.9,<5"]
redis = ["redis>=5,<9"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1", "mypy>=1.15,<2", "mongomock>=4.3,<5", "fakeredis>=2.28,<3"]

[project.urls]
Repository = "https://github.com/Elyon0517/versioned-agent-memory"
Issues = "https://github.com/Elyon0517/versioned-agent-memory/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_memory_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires explicitly configured local MongoDB and Redis services"]

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agent_memory_kit"]
